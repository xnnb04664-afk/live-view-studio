<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d0d" />
    <meta name="description" content="Live View Studio is an open-source Windows webcam viewer and photo-capture desktop app." />
    <title>取景台 · Live View Studio</title>
    <style>
      :root { color-scheme: dark; font-family: "Manrope", "Segoe UI Variable", "Microsoft YaHei UI", sans-serif; background: #0b0d0d; color: #e8e4d9; }
      html, body, #root { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      .boot-stage { position: relative; display: grid; width: 100%; height: 100%; place-items: center; overflow: hidden; background: radial-gradient(ellipse at 50% 54%, rgba(38, 42, 39, .68), #0b0d0d 66%); }
      .boot-stage::before { position: absolute; inset: 24px; border: 1px solid rgba(218, 208, 180, .08); content: ""; pointer-events: none; }
      .boot-card { display: grid; grid-template-columns: 64px auto; align-items: center; gap: 0 19px; width: min(330px, calc(100% - 64px)); }
      .boot-lens { position: relative; display: grid; grid-row: span 2; width: 58px; height: 58px; place-items: center; border: 1px solid rgba(227, 181, 100, .38); border-radius: 50%; box-shadow: 0 0 0 8px rgba(227, 181, 100, .035), inset 0 0 24px rgba(227, 181, 100, .06); }
      .boot-lens::before { width: 21px; height: 21px; border: 1px solid rgba(227, 181, 100, .7); border-radius: 50%; content: ""; }
      .boot-lens::after { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #91b879; box-shadow: 0 0 12px rgba(145, 184, 121, .55); content: ""; }
      .boot-kicker { margin: 0 0 5px; color: #9b7b43; font: 500 9px/1.2 "DM Mono", Consolas, monospace; letter-spacing: .2em; }
      .boot-title { margin: 0; color: #f1eee4; font: 700 23px/1.2 "Bahnschrift", "Manrope", "Microsoft YaHei UI", sans-serif; letter-spacing: .07em; }
      .boot-status { grid-column: 2; display: flex; align-items: center; gap: 8px; margin: 13px 0 0; color: #777c75; font-size: 10px; }
      .boot-status::before { width: 5px; height: 5px; border-radius: 50%; background: #e3b564; content: ""; }
      .boot-rule { grid-column: 1 / -1; height: 1px; margin-top: 25px; overflow: hidden; background: rgba(218, 208, 180, .1); }
      .boot-rule::after { display: block; width: 28%; height: 100%; background: linear-gradient(90deg, transparent, #e3b564, transparent); animation: boot-sweep 1.25s ease-in-out infinite; content: ""; }
      @keyframes boot-sweep { from { transform: translateX(-110%); } to { transform: translateX(390%); } }
      @media (prefers-reduced-motion: reduce) { .boot-rule::after { animation: none; transform: translateX(130%); } }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-stage" role="status" aria-live="polite">
        <div class="boot-card">
          <div class="boot-lens" aria-hidden="true"></div>
          <div>
            <p class="boot-kicker">LIVE VIEW STUDIO</p>
            <h1 class="boot-title">取景台</h1>
          </div>
          <p class="boot-status">正在准备取景设备</p>
          <div class="boot-rule" aria-hidden="true"></div>
        </div>
      </main>
    </div>
    <script>
      try {
        if (localStorage.getItem("live-view-studio:language") === "en-US") {
          document.documentElement.lang = "en";
          document.title = "Live View Studio — Webcam Viewer for Windows";
          const bootTitle = document.querySelector(".boot-title");
          const bootStatus = document.querySelector(".boot-status");
          if (bootTitle) bootTitle.textContent = "Live View Studio";
          if (bootStatus) bootStatus.textContent = "Preparing camera preview";
        }
      } catch {
        // Keep the default Chinese splash if browser storage is unavailable.
      }
    </script>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
